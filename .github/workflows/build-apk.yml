name: Build Android APK (RotaPlan Yandex Navigasyon)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 (Required by Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets (Vite)
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APKs with Fixed Keystore
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/rotaplan-yandex-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk build-output/rotaplan-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/rotaplan-yandex-release.apk
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/rotaplan-release.apk
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/rotaplan-yandex-debug.apk
          fi
          ls -la build-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rotaplan-yandex-apk
          path: build-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.4' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('RotaPlan {0} - Yandex Navigasyon & Saha Takip', github.ref_name) || 'RotaPlan v1.0.4 - Yandex Navigasyon & Saha Takip' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build-output/rotaplan-yandex-release.apk
            build-output/rotaplan-release.apk
            build-output/rotaplan-yandex-debug.apk
          body: |
            ## 🚀 RotaPlan - Yandex Navigasyon & Saha Takip Android APK

            Bu sürüm ile uygulama doğrudan Android cihazınızda tam teşekküllü ve bağımsız olarak Yandex Navigasyon ile çalışır:

            ### ✨ Temel Özellikler
            - **Yandex Navigasyon Doğrudan Başlatma:** Herhangi bir adrese veya durağa tıklandığında anında `yandexnavi://build_route_on_map?lat_to={lat}&lon_to={lng}` intent'i ile Yandex Navigasyon açılır ve canlı sesli sürüş navigasyonu başlar.
            - **Yandex Çoklu Rota:** "Tümünü Yandex'te Başlat" butonu ile sıralı tüm duraklar tek tıkla Yandex Haritalar'a aktarılır.
            - **Kalıcı Rotalar ve Eksikler Sayfası:** Önceden tanımlı veya KML'den aktarılan 77 firma rotası, alfabetik firma rehberi ve eksikler listesi.
            - **%100 Çevrimdışı (Offline-First) Hafıza:** Adresler, notlar ve rotalar yerel cihaz hafızasında güvenle saklanır, internet gitse bile kaybolmaz.
            - **Kalıcı İmza Sertifikası (`rotaplan.keystore`):** Güncellemelerde paket çakışması yaşanmaz.
            - **Koyu Tema & Güvenli Mimari:** Cihazı yormayan ultra hafif ve güvenli yapı.

            ---
            📲 **İndirme Bağlantısı:** Aşağıdaki `.apk` dosyasını telefonunuza indirip tek tıkla kurabilirsiniz.
