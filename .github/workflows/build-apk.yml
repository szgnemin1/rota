name: Build Android APK (RotaPlan Google Maps)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 (Required by Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets (Vite)
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android APKs with Fixed Keystore
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/rotaplan-googlemaps-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/rotaplan-googlemaps-release.apk
          fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/rotaplan-googlemaps-debug.apk
          fi
          ls -la build-output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rotaplan-googlemaps-apk
          path: build-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('RotaPlan {0} - Google Haritalar Otomatik Navigasyon', github.ref_name) || 'RotaPlan v1.0.2 - Google Haritalar Otomatik Navigasyon' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build-output/rotaplan-googlemaps-release.apk
            build-output/rotaplan-googlemaps-debug.apk
          body: |
            ## 🚀 RotaPlan - Google Haritalar & Saha Takip Android APK

            Bu sürüm ile uygulama doğrudan Android cihazınızda tam teşekküllü ve bağımsız olarak çalışır:

            ### ✨ Temel Özellikler
            - **Google Haritalar Canlı Navigasyon:** Herhangi bir adrese veya durağa tıklandığında anında `google.navigation:q=lat,lng&mode=d` intent'i ile Google Haritalar açılır ve GPS sesli sürüş navigasyonu başlar.
            - **Çoklu Durak Rotası:** "Google Haritalar'da Rotayı Başlat" butonu ile sıralı tüm duraklar tek tıkla Google Maps rota ekranına aktarılır.
            - **%100 Çevrimdışı (Offline-First) Hafıza:** VDS sunucusuna ihtiyaç duymadan adresler, duraklar ve rotalar yerel cihaz hafızasında güvenle saklanır.
            - **Kalıcı İmza Sertifikası (`rotaplan.keystore`):** Gelecekteki güncellemelerde "Paket çakışması" hatası yaşanmaması için sabit imzalama yapılandırıldı.
            - **Saha Araçları:** Tek tıkla doğrudan telefon araması (`tel:`) ve WhatsApp mesajlaşma desteği.

            ---
            📲 **İndirme Bağlantısı:** Aşağıdaki `.apk` dosyasını telefonunuza indirip tek tıkla kurabilirsiniz.
